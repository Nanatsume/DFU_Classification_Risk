name: capture_app tests

on:
  push:
    paths:
      - "capture_app/**"
      - ".github/workflows/capture-app-tests.yml"
  pull_request:
    paths:
      - "capture_app/**"
      - ".github/workflows/capture-app-tests.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -v
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture_app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: capture_app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
