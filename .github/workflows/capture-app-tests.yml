name: capture_app tests

on:
  push:
    paths:
      - "capture_app/**"
      - ".github/workflows/capture-app-tests.yml"
  pull_request:
    paths:
      - "capture_app/**"
      - ".github/workflows/capture-app-tests.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 because that is what ships: setup.ps1 requires it, and requirements.lock.txt
          # pins the versions the app was tested against, several of which (numpy 2.5.1 among
          # them) refuse to install on 3.11. CI on a version nobody runs proves nothing.
          python-version: "3.12"
      # The lock files, not the loose ones — the point of CI here is to check what a fresh
      # machine actually gets, and requirements.txt only states intent.
      - run: pip install -r requirements.lock.txt -r requirements-dev.lock.txt
      - run: pytest tests/ -v
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture_app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: capture_app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
